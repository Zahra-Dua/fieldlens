services:
  db:
    image: postgres:16
    container_name: fieldlens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - fieldlens_postgres_data:/var/lib/postgresql/data

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: fieldlens-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "on"
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # Web console (browse buckets in a browser)
    volumes:
      - fieldlens_minio_data:/bitnami/minio/data

volumes:
  fieldlens_postgres_data:
  fieldlens_minio_data: