server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite file names contain a hash, so they can be cached for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # React Router: any other URL (like /inspections/123) must return index.html,
  # otherwise a page refresh gives 404.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
