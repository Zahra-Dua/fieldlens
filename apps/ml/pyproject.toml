[project]
name = "fieldlens-ml"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ai-edge-litert>=2.3.0",
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
